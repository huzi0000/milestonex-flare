<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08130f" />
    <script>
      (() => { const saved = localStorage.getItem('milestonex:theme'); const theme = saved === 'light' || saved === 'dark' ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); document.documentElement.dataset.theme = theme; document.documentElement.style.colorScheme = theme; })();
    </script>
    <meta name="robots" content="noindex,nofollow" />
    <title>MilestoneX — Coston2 Deployment Console</title>
  </head>
  <body>
    <div id="deploy-root"></div>
    <script type="module" src="/src/deploy-main.tsx"></script>
  </body>
</html>
